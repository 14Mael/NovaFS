server:
  port: 8080

spring:
  application:
    name: nova-fs
  datasource:
    url: jdbc:mysql://localhost:3306/nova_fs?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms

  # 上传大小限制：分片 5MB/片，普通上传 ≤5MB，留足余量
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  jwt-secret-key: nova-fs-jwt-secret-key-2026

logging:
  level:
    io.novafs: DEBUG

# ================= 通知配置 =================
novafs:
  notify:
    enabled: false            # 邮件通知开关，SMTP 用标准 spring.mail.* 配置
    mail:
      from: no-reply@example.com
  # ================= RAG 配置 =================
  rag:
    enabled: true
    embedding:
      base-url: https://api.openai.com/v1
      api-key: ${RAG_API_KEY:}
      model: text-embedding-3-small
      dimensions: 1536
    chat:
      base-url: https://api.openai.com/v1
      api-key: ${RAG_API_KEY:}
      model: gpt-4o-mini
      temperature: 0.3
      max-tokens: 1024
    qdrant:
      base-url: http://localhost:6333
      api-key: ${QDRANT_API_KEY:}
      collection: novafs_docs
      vector-size: 1536
    splitter:
      chunk-size: 800
      chunk-overlap: 100
    search:
      top-k: 5
      min-score: 0.0