# NovaFS 国际化消息（默认中文）
# 通用
error.200=ok
error.400=请求参数错误
error.401=未登录或登录已过期
error.403=权限不足
error.404=资源不存在
error.405=请求方法不允许
error.409=资源冲突
error.429=请求过于频繁
error.500=服务器内部错误
error.503=服务暂不可用

# 用户
error.1001=用户已存在
error.1002=用户不存在
error.1003=用户已被禁用
error.1004=密码错误
error.1005=邮箱已被使用
error.1006=验证码错误或已过期

# 文件
error.2001=文件不存在
error.2002=文件名重复
error.2003=文件大小超出限制
error.2004=存储配额不足
error.2005=分片MD5校验失败
error.2006=分片未上传完成

# 工作空间
error.3001=工作空间不存在
error.3002=工作空间标识已存在
error.3003=不是工作空间成员
error.3004=邀请已过期
error.3005=邀请已被接受

# 存储
error.4001=存储平台不存在
error.4002=存储配置错误
error.4003=文件上传失败
error.4004=文件下载失败
error.4005=文件删除失败

# 分享
error.5001=分享不存在
error.5002=分享已过期
error.5003=提取码错误
error.5004=查看次数已达上限

# RAG
error.6001=向量化失败
error.6002=对话生成失败
error.6003=RAG文档不存在
error.6004=文档解析失败
error.6005=向量库不可用
